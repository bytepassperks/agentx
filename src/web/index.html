<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentx</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161920; --panel2: #1c2029; --border: #262b36; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #a78bfa; --accent2: #7c3aed; --green: #34d399; --red: #f87171; --yellow: #fbbf24; --cyan: #67e8f9;
    --mono: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  body { display: grid; grid-template-rows: 48px 1fr auto; grid-template-columns: 1fr 300px; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); -webkit-app-region: drag; }
  header .logo { font-weight: 700; color: var(--accent); letter-spacing: .3px; }
  header .ver { color: var(--muted); font-size: 12px; }
  header .cwd { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; -webkit-app-region: no-drag; }
  header .cwd button { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; -webkit-app-region: no-drag; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: white; }
  button.danger { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .45; cursor: default; }
  main { overflow-y: auto; padding: 18px 20px 10px; scroll-behavior: smooth; }
  aside { border-left: 1px solid var(--border); background: var(--panel); padding: 14px; overflow-y: auto; font-size: 13px; }
  aside h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  aside .todo { display: flex; gap: 8px; padding: 4px 0; color: var(--muted); }
  aside .todo.in_progress { color: var(--text); }
  aside .todo.completed { text-decoration: line-through; opacity: .6; }
  aside .todo .mark { font-family: var(--mono); color: var(--accent); }
  aside .session { padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .session:hover { background: var(--panel2); color: var(--text); }
  aside .session.active { color: var(--accent); }
  aside .section { margin-bottom: 20px; }
  footer { grid-column: 1 / 2; padding: 10px 20px 14px; background: var(--bg); }
  .composer { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 8px 8px 14px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; background: transparent; border: 0; color: var(--text); resize: none; font: inherit; outline: none; max-height: 220px; min-height: 24px; padding: 4px 0; }
  .status { color: var(--muted); font-size: 12px; margin: 6px 4px 0; min-height: 16px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
  .msg { max-width: 900px; margin: 0 auto 14px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { background: var(--accent2); color: white; padding: 9px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant .md { padding: 2px 0; word-break: break-word; }
  .msg.info { color: var(--muted); font-size: 12px; text-align: center; }
  .msg.warn { color: var(--yellow); font-size: 12px; text-align: center; }
  .status.err { color: var(--red); }
  .hint { color: var(--muted); font-size: 11.5px; margin: 4px 0 8px; }
  .hint a { color: var(--accent); }
  .modal select { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; font: inherit; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input, .inline select { flex: 1; margin-bottom: 0; }
  .msg.error .bubble { color: var(--red); background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.3); padding: 8px 12px; border-radius: 8px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  .ask { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.4); color: var(--yellow); padding: 10px 14px; border-radius: 8px; }
  .tool { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; margin: 6px 0; font-size: 12.5px; overflow: hidden; }
  .tool summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 7px 10px; cursor: pointer; color: var(--muted); font-family: var(--mono); }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary .name { color: var(--cyan); font-weight: 600; }
  .tool summary .sum { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool summary .time { font-size: 11px; }
  .tool.running summary .name::before { content: "● "; color: var(--accent); animation: pulse 1s infinite; }
  .tool.ok summary .name::before { content: "✓ "; color: var(--green); }
  .tool.err summary .name::before { content: "✗ "; color: var(--red); }
  .tool pre { margin: 0; padding: 10px; border-top: 1px solid var(--border); max-height: 320px; overflow: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; color: #c9d1e0; }
  .tool pre.err { color: var(--red); }
  .tool .label { padding: 4px 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; border-top: 1px solid var(--border); background: var(--panel2); }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3 { margin: 14px 0 8px; font-size: 15px; }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 0 0 10px; }
  .md pre code { background: transparent; padding: 0; }
  .md a { color: var(--accent); }
  .md blockquote { border-left: 3px solid var(--border); margin: 0 0 10px; padding: 2px 12px; color: var(--muted); }
  .md table { border-collapse: collapse; margin: 0 0 10px; }
  .md td, .md th { border: 1px solid var(--border); padding: 4px 8px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 560px; max-width: 95vw; max-height: 85vh; overflow: auto; padding: 18px; }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font: inherit; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dirlist { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; }
  .dirlist div { padding: 6px 10px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
  .dirlist div:hover { background: var(--panel2); }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h1 { color: var(--accent); font-size: 30px; margin-bottom: 6px; }
  .empty .hints { display: grid; gap: 8px; max-width: 520px; margin: 22px auto 0; }
  .empty .hints button { text-align: left; padding: 10px 14px; background: var(--panel); }
  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="logo">agentx</span><span class="ver" id="ver"></span>
  <div class="cwd"><span style="color:var(--muted)">📁</span><button id="cwdBtn" title="Change project folder">…</button></div>
  <button id="newBtn" title="Start a new session">New</button>
  <button id="compactBtn" title="Summarize the conversation to free up context">Compact</button>
  <button id="settingsBtn">Settings</button>
</header>

<main id="main">
  <div class="empty" id="empty">
    <h1>agentx</h1>
    <div>Autonomous coding agent working in <span id="emptyCwd" style="font-family:var(--mono)"></span></div>
    <div class="hints">
      <button data-hint="Explore this project and summarize its structure, build/test commands and conventions. Save what you learn to memory.">Explore this project and remember how it works</button>
      <button data-hint="Run the test suite, fix any failures, and commit the fixes.">Run the tests and fix failures</button>
      <button data-hint="Review the uncommitted changes in this repo for bugs and issues.">Review my uncommitted changes</button>
    </div>
    <p style="margin-top:20px;font-size:12px">Click the folder in the header to switch project. <span class="kbd">Enter</span> send · <span class="kbd">Shift+Enter</span> newline · <span class="kbd">Esc</span> stop</p>
  </div>
</main>

<aside>
  <div class="section">
    <h3>Tasks</h3>
    <div id="todos"><div style="color:var(--muted)">No tasks yet</div></div>
  </div>
  <div class="section">
    <h3>Sessions in this folder</h3>
    <div id="sessions"></div>
  </div>
</aside>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Describe a task… (e.g. “add a dark mode toggle and open a PR”)"></textarea>
    <button id="stopBtn" class="danger" style="display:none">Stop</button>
    <button id="sendBtn" class="primary">Send</button>
  </div>
  <div class="status" id="status"></div>
</footer>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <label>Provider</label>
    <select id="sPreset"></select>
    <div class="hint" id="sKeyHint"></div>
    <label>API key</label><input id="sToken" placeholder="paste key (leave as-is to keep)" />
    <label>API base URL</label><input id="sBase" />
    <label>Model</label>
    <div class="inline"><select id="sModelSel"></select><button id="sRefresh" title="Fetch the live model list from the provider">Refresh</button></div>
    <input id="sModel" placeholder="or type a model id" style="margin-top:8px" />
    <div class="hint" id="sModelHint"></div>
    <label>GitHub token (for push / PRs)</label><input id="sGh" placeholder="ghp_… (leave as-is to keep)" />
    <label>Max output tokens</label><input id="sMax" type="number" />
    <div class="row"><button id="sCancel">Cancel</button><button id="sSave" class="primary">Save</button></div>
  </div>
</div>

<div class="modal-bg" id="folderModal">
  <div class="modal">
    <h2>Project folder</h2>
    <div style="display:flex;gap:8px"><input id="fPath" style="flex:1" /><button id="fBrowse" title="Open native folder picker">Browse…</button></div>
    <div class="dirlist" id="fList"></div>
    <div class="row"><button id="fCancel">Cancel</button><button id="fOpen" class="primary">Open folder</button></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const main = $("main"), input = $("input"), status = $("status"), sendBtn = $("sendBtn"), stopBtn = $("stopBtn");
  let ws, state = { busy: false }, currentText = null, currentTextBuf = "", tools = new Map(), askMode = false;

  // ---------- markdown ----------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function md(src) {
    const lines = src.replace(/\r\n/g, "\n").split("\n");
    let out = "", i = 0, list = null, para = [];
    const flushP = () => { if (para.length) { out += `<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`; para = []; } };
    const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
    while (i < lines.length) {
      const l = lines[i];
      const fence = l.match(/^\s*```(\w*)/);
      if (fence) {
        flushP(); closeList();
        let code = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out += `<pre><code class="lang-${fence[1]}">${esc(code.join("\n"))}</code></pre>`;
        continue;
      }
      const h = l.match(/^(#{1,3})\s+(.*)/);
      if (h) { flushP(); closeList(); out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        flushP();
        const kind = ul ? "ul" : "ol";
        if (list !== kind) { closeList(); out += `<${kind}>`; list = kind; }
        out += `<li>${inline((ul || ol)[1])}</li>`; i++; continue;
      }
      if (/^\s*>\s?/.test(l)) { flushP(); closeList(); out += `<blockquote>${inline(l.replace(/^\s*>\s?/, ""))}</blockquote>`; i++; continue; }
      if (/^\s*---+\s*$/.test(l)) { flushP(); closeList(); out += "<hr>"; i++; continue; }
      if (!l.trim()) { flushP(); closeList(); i++; continue; }
      closeList(); para.push(l); i++;
    }
    flushP(); closeList();
    return out;
  }

  // ---------- rendering ----------
  const nearBottom = () => main.scrollHeight - main.scrollTop - main.clientHeight < 120;
  function scroll(force) { if (force || nearBottom()) main.scrollTop = main.scrollHeight; }
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function hideEmpty() { const e = $("empty"); if (e) e.remove(); }

  function addUser(text) {
    hideEmpty();
    main.appendChild(el(`<div class="msg user"><div class="bubble">${esc(text)}</div></div>`));
    scroll(true);
  }
  function addInfo(text, cls = "info") {
    hideEmpty();
    main.appendChild(el(`<div class="msg ${cls}">${cls === "error" ? `<div class="bubble">${esc(text)}</div>` : esc(text)}</div>`));
    scroll();
  }
  function ensureText() {
    if (!currentText) {
      hideEmpty();
      currentText = el(`<div class="msg assistant"><div class="md"></div></div>`);
      currentTextBuf = "";
      main.appendChild(currentText);
    }
    return currentText.firstChild;
  }
  function textDelta(d) {
    const node = ensureText();
    currentTextBuf += d;
    node.innerHTML = md(currentTextBuf);
    scroll();
  }
  function textEnd() { currentText = null; currentTextBuf = ""; }
  function addTool(id, name, summary, inputObj, done) {
    hideEmpty();
    currentText = null;
    const inputStr = inputObj ? (name === "write_file" ? `${inputObj.path}\n\n${inputObj.content ?? ""}` : name === "edit_file" ? `${inputObj.path}\n--- old\n${inputObj.old_string}\n+++ new\n${inputObj.new_string}` : JSON.stringify(inputObj, null, 2)) : "";
    const t = el(`<details class="tool ${done ? "" : "running"}"><summary><span class="name">${esc(name)}</span><span class="sum">${esc(summary || "")}</span><span class="time"></span></summary><div class="label">input</div><pre class="in">${esc(inputStr)}</pre></details>`);
    t.dataset.id = id;
    main.appendChild(t);
    tools.set(id, t);
    scroll();
    return t;
  }
  function endTool(id, output, isError, ms) {
    const t = tools.get(id);
    if (!t) return;
    t.classList.remove("running");
    t.classList.add(isError ? "err" : "ok");
    if (ms != null) t.querySelector(".time").textContent = (ms / 1000).toFixed(1) + "s";
    t.appendChild(el(`<div class="label">output</div>`));
    t.appendChild(el(`<pre class="${isError ? "err" : ""}">${esc(output.length > 20000 ? output.slice(0, 20000) + "\n…" : output)}</pre>`));
    if (isError) t.open = true;
    scroll();
  }
  function renderHistory(msgs) {
    main.innerHTML = "";
    tools.clear(); currentText = null;
    if (!msgs.length) {
      main.appendChild(emptyTemplate.cloneNode(true));
      bindHints();
      $("emptyCwd").textContent = state.cwd || "";
      return;
    }
    for (const m of msgs) {
      for (const p of m.parts) {
        if (p.kind === "text") {
          if (m.role === "user") {
            if (p.text.startsWith("[Context was compacted")) addInfo("Context compacted"); else addUser(p.text);
          } else { const n = el(`<div class="msg assistant"><div class="md"></div></div>`); n.firstChild.innerHTML = md(p.text); main.appendChild(n); }
        } else if (p.kind === "tool_use") addTool(p.id, p.name, p.summary, p.input, true);
        else if (p.kind === "tool_result") endTool(p.id, p.output, p.isError, null);
      }
    }
    scroll(true);
  }
  const emptyTemplate = $("empty").cloneNode(true);
  function bindHints() {
    document.querySelectorAll("[data-hint]").forEach((b) => b.onclick = () => { input.value = b.dataset.hint; send(); });
  }
  bindHints();

  function setBusy(b, label) {
    state.busy = b;
    stopBtn.style.display = b ? "" : "none";
    sendBtn.disabled = b && !askMode;
    status.innerHTML = b ? `<span class="dot"></span>${esc(label || "working…")}` : "";
    document.title = (b ? "● " : "") + "agentx — " + (state.cwd || "");
  }
  function renderTodos(todos) {
    const box = $("todos");
    if (!todos || !todos.length) { box.innerHTML = `<div style="color:var(--muted)">No tasks yet</div>`; return; }
    const mark = { pending: "○", in_progress: "◐", completed: "●" };
    box.innerHTML = todos.map((t) => `<div class="todo ${t.status}"><span class="mark">${mark[t.status] || "○"}</span><span>${esc(t.content)}</span></div>`).join("");
  }
  function renderSessions(list, activeId) {
    $("sessions").innerHTML = list.length ? list.map((s) => `<div class="session ${s.id === activeId ? "active" : ""}" data-id="${s.id}" title="${esc(s.title)}">${esc(s.title || "(untitled)")} <span style="opacity:.6">· ${s.count}</span></div>`).join("") : `<div style="color:var(--muted)">None yet</div>`;
    document.querySelectorAll(".session").forEach((n) => n.onclick = () => send_ws({ type: "resume", id: n.dataset.id }));
  }
  function applyState(s) {
    state = { ...state, ...s };
    $("ver").textContent = "v" + s.version + " · " + s.model;
    $("cwdBtn").textContent = s.cwd;
    renderHistory(s.messages);
    renderTodos(s.todos);
    renderSessions(s.sessions, s.sessionId);
    setBusy(s.busy);
    if (!s.hasToken) { openSettings(); addInfo("No API token configured — add it in Settings.", "error"); }
  }

  // ---------- websocket ----------
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { status.textContent = ""; send_ws({ type: "hello" }); };
    ws.onclose = () => { status.textContent = "disconnected — retrying…"; setTimeout(connect, 1000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      switch (m.type) {
        case "state": applyState(m); break;
        case "user": addUser(m.text); status.classList.remove("err"); status.textContent = ""; setBusy(true, "thinking"); break;
        case "thinking": setBusy(true, m.label); break;
        case "text_delta": setBusy(true, "writing"); textDelta(m.delta); break;
        case "text_end": textEnd(); break;
        case "tool_start": addTool(m.id, m.name, m.summary, m.input, false); setBusy(true, m.name); break;
        case "tool_end": endTool(m.id, m.output, m.isError, m.ms); break;
        case "todos": renderTodos(m.todos); break;
        case "info": addInfo(m.text); break;
        case "warn": addInfo(m.text, "warn"); break;
        case "error": addInfo(m.text, "error"); status.textContent = "error: " + m.text.slice(0, 160); status.classList.add("err"); break;
        case "models": onModels(m); break;
        case "ask": askMode = true; hideEmpty(); main.appendChild(el(`<div class="msg"><div class="ask">❓ ${esc(m.question)}</div></div>`)); setBusy(true, "waiting for your answer"); sendBtn.disabled = false; input.placeholder = "Type your answer…"; input.focus(); scroll(true); break;
        case "done": askMode = false; input.placeholder = "Describe a task…"; textEnd(); setBusy(false); break;
        case "dir": renderDir(m); break;
        case "shell_result": addTool("sh" + Date.now(), "shell", "", null, true); endTool([...tools.keys()].pop(), m.output, false, null); break;
      }
    };
  }
  function send_ws(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  // ---------- composer ----------
  function send() {
    const text = input.value.trim();
    if (!text) return;
    if (state.busy && !askMode) return;
    if (text.startsWith("!")) { send_ws({ type: "shell", command: text.slice(1) }); input.value = ""; autosize(); return; }
    if (text === "/compact") { send_ws({ type: "compact" }); input.value = ""; return; }
    if (text === "/new" || text === "/clear") { send_ws({ type: "new" }); input.value = ""; return; }
    if (askMode) { addUser(text); askMode = false; input.placeholder = "Describe a task…"; }
    send_ws({ type: "user", text });
    input.value = "";
    autosize();
  }
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    if (e.key === "Escape" && state.busy) send_ws({ type: "abort" });
  });
  sendBtn.onclick = send;
  stopBtn.onclick = () => send_ws({ type: "abort" });
  $("newBtn").onclick = () => send_ws({ type: "new" });
  $("compactBtn").onclick = () => send_ws({ type: "compact" });

  // ---------- settings ----------
  const norm = (u) => (u || "").replace(/\/+$/, "");
  function presetFor(baseUrl) { return (state.presets || []).find((p) => norm(baseUrl).startsWith(p.baseUrl)); }
  function fillModels(list, current) {
    const sel = $("sModelSel");
    const items = [...new Set([...(current ? [current] : []), ...list])];
    sel.innerHTML = items.map((m) => `<option value="${esc(m)}" ${m === current ? "selected" : ""}>${esc(m)}</option>`).join("") + `<option value="" ${current ? "" : "selected"}>custom…</option>`;
  }
  function applyPreset(id, keepValues) {
    const p = (state.presets || []).find((x) => x.id === id);
    if (p) {
      if (!keepValues) { $("sBase").value = p.baseUrl; $("sModel").value = p.models[0] || ""; $("sToken").value = ""; }
      $("sKeyHint").innerHTML = `Get a free key at <a href="${esc(p.keyUrl)}" target="_blank" rel="noopener">${esc(p.keyUrl.replace(/^https?:\/\//, ""))}</a>`;
      fillModels(p.models, $("sModel").value);
    } else {
      $("sKeyHint").textContent = "Custom: any OpenAI-compatible (/v1/chat/completions) or Anthropic-compatible (/v1/messages) endpoint.";
      fillModels([], $("sModel").value);
    }
    $("sModelHint").textContent = p && p.models.length ? "Suggested models listed; press Refresh for everything the provider offers." : "Press Refresh to load the provider's model list.";
  }
  function openSettings() {
    const c = state.config || {};
    const presets = state.presets || [];
    const cur = presetFor(c.baseUrl);
    $("sPreset").innerHTML = presets.map((p) => `<option value="${p.id}" ${cur && cur.id === p.id ? "selected" : ""}>${esc(p.label)}</option>`).join("") + `<option value="custom" ${cur ? "" : "selected"}>Custom endpoint</option>`;
    $("sBase").value = c.baseUrl || ""; $("sToken").value = c.authToken || ""; $("sModel").value = c.model || ""; $("sGh").value = c.githubToken || ""; $("sMax").value = c.maxTokens || 8192;
    applyPreset(cur ? cur.id : "custom", true);
    $("settingsModal").classList.add("show");
  }
  function onModels(m) {
    $("sRefresh").disabled = false; $("sRefresh").textContent = "Refresh";
    if (m.error) { $("sModelHint").textContent = "Could not list models: " + m.error; return; }
    fillModels(m.models, $("sModel").value);
    $("sModelHint").textContent = m.models.length + " models available";
  }
  $("sPreset").onchange = () => applyPreset($("sPreset").value, false);
  $("sModelSel").onchange = () => { if ($("sModelSel").value) $("sModel").value = $("sModelSel").value; };
  $("sRefresh").onclick = () => {
    $("sRefresh").disabled = true; $("sRefresh").textContent = "Loading…";
    send_ws({ type: "list_models", patch: { baseUrl: $("sBase").value.trim(), authToken: $("sToken").value.trim() } });
  };
  $("settingsBtn").onclick = openSettings;
  $("sCancel").onclick = () => $("settingsModal").classList.remove("show");
  $("sSave").onclick = () => {
    const p = (state.presets || []).find((x) => x.id === $("sPreset").value);
    const patch = { baseUrl: $("sBase").value.trim(), authToken: $("sToken").value.trim(), model: $("sModel").value.trim(), githubToken: $("sGh").value.trim(), maxTokens: Number($("sMax").value) || 8192 };
    if (p) patch.provider = p.provider;
    send_ws({ type: "set_config", patch });
    $("settingsModal").classList.remove("show");
  };

  // ---------- folder ----------
  function renderDir(m) {
    $("fPath").value = m.path;
    $("fList").innerHTML = `<div data-p="${esc(m.parent)}">..</div>` + m.entries.map((n) => `<div data-p="${esc(m.path.replace(/[\\/]$/, "") + (m.path.includes("\\") ? "\\" : "/") + n)}">${esc(n)}/</div>`).join("");
    $("fList").querySelectorAll("div").forEach((d) => d.onclick = () => send_ws({ type: "list_dir", path: d.dataset.p }));
  }
  $("cwdBtn").onclick = () => { $("folderModal").classList.add("show"); send_ws({ type: "list_dir", path: state.cwd }); };
  $("fCancel").onclick = () => $("folderModal").classList.remove("show");
  $("fOpen").onclick = () => { send_ws({ type: "set_cwd", cwd: $("fPath").value.trim() }); $("folderModal").classList.remove("show"); };
  $("fBrowse").onclick = () => { $("folderModal").classList.remove("show"); send_ws({ type: "pick_folder" }); };
  $("fPath").addEventListener("keydown", (e) => { if (e.key === "Enter") send_ws({ type: "list_dir", path: $("fPath").value.trim() }); });
  document.querySelectorAll(".modal-bg").forEach((m) => m.addEventListener("click", (e) => { if (e.target === m) m.classList.remove("show"); }));

  connect();
  input.focus();
})();
</script>
</body>
</html>
